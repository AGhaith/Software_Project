name: Trigger auto deployment for localbrandatlas

on:
  push:
    branches: 
      [ master ]
    paths:
      - 'Backend/**' # Only trigger if files in Backend change
      - '.github/workflows/**'

  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4 # Updated to v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.LOCALBRANDATLAS_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/Backend
          dockerfilePath: Dockerfile 
          registryUrl: docker.io
          registryUsername: ${{ secrets.LOCALBRANDATLAS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LOCALBRANDATLAS_REGISTRY_PASSWORD }}
          containerAppName: localbrandatlas
          resourceGroup: SoftwareProject
          # Fixed: Format must be username/repo:tag
          imageToBuild: docker.io/aghaith1/localbrandfinder-api:${{ github.sha }}