name: Trigger auto deployment for localbrandatlas

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/localbrandatlas-AutoDeployTrigger-91b07b93-57bc-420b-96d1-6cac60ee6b9a.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.LOCALBRANDATLAS_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/Backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: docker.io
          registryUsername: ${{ secrets.LOCALBRANDATLAS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.LOCALBRANDATLAS_REGISTRY_PASSWORD }}
          containerAppName: localbrandatlas
          resourceGroup: SoftwareProject
          imageToBuild: aghaith1/aghaith1/localbrandfinder-api:${{ github.sha }}
          
            

     

